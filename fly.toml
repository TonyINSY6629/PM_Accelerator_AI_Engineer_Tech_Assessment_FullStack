# fly.toml app configuration file generated for pm-accelerator-ai-engineer-assessment-full-stack on 2026-08-14T15:29:42-06:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'pm-accelerator-ai-engineer-assessment-full-stack'
primary_region = 'dfw'

[build]
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

# The database is a SQLite file, so it needs somewhere that survives a restart.
# A volume attaches to exactly one machine, which is also why this app must run a
# single instance: two machines would each hold their own copy and disagree.
[mounts]
  source = "weather_data"
  destination = "/data"

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
